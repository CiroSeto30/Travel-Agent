<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <title>Le mie prenotazioni | Travel Agent</title>
  <script type="module" src="js/bookings.js"></script>
</head>
<body class="app-page">
  <header class="app-header">
    <a class="brand" href="chat.html">Travel Agent</a>
    <nav class="app-nav" aria-label="Principale">
      <a href="chat.html">Chat</a>
      <a href="bookings.html" aria-current="page">Le mie prenotazioni</a>
      <span class="user-name"></span>
      <button class="button button--link" id="logout" type="button">Esci</button>
    </nav>
  </header>
  <main class="chat-layout">
    <section class="bookings" aria-labelledby="bookings-title">
      <h1 id="bookings-title" class="bookings__title">Le mie prenotazioni</h1>
      <p class="bookings__status" id="bookings-status" role="status">Carico le prenotazioni…</p>
      <ul class="tickets" id="bookings"></ul>
    </section>

    <aside class="details" id="details" aria-labelledby="details-title" hidden>
      <div class="details__head">
        <h2 id="details-title" class="details__variant"></h2>
        <button class="button button--link details__close" type="button" aria-label="Chiudi i dettagli">Chiudi</button>
      </div>
      <p class="details__total"></p>
      <p class="details__trip"></p>
      <p class="details__note" role="status" hidden></p>
      <div class="details__program"></div>
    </aside>
  </main>
</body>
</html>
